# Cloud check on every push: build and the unit tests that need no game files.
# Tests that read the install are skipped here (no NFSPU_GAME_DIR); race_drive and the oracle
# run on the coordinator's machine (scripts/check.sh). Failures post to the Discord channel.
name: ci
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - name: Post failure to Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          msg="CI (GitHub): FAILED on master ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sf -H "Content-Type: application/json" -d "{\"content\":\"$msg\"}" "$WEBHOOK"
